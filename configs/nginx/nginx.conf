server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # The backend serves GraphQL at /query (chatney-backend Program.cs: MapGraphQL("/query"))
    location = /graphql {
        # "backend" is the compose service name; 8080 is the port inside the container
        proxy_pass http://backend:8080/query;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Attachments are uploaded through this endpoint; nginx's default limit is 1m.
        # 30m matches Kestrel's default MaxRequestBodySize.
        client_max_body_size 30m;
    }

    # The backend accepts websocket connections at /ws (chatney-backend Infra/MIddleware/WebSocket.cs)
    location = /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than the backend's 120s websocket keep-alive, so idle connections aren't dropped
        proxy_read_timeout 300s;
    }

    error_page  404              /index.html;

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
